info:
  name: Update Company
  type: http
  seq: 4
  tags:
    - companies
    - platform
http:
  method: PATCH
  url: "{{baseUrl}}/identity/companies/{{companyId}}"
  params:
    - name: companyId
      value: "{{companyId}}"
      type: path
  headers:
    - name: Content-Type
      value: application/json
    - name: x-tracking-id
      value: "{{trackingId}}"
  body:
    type: json
    data: |-
      {
        "name": "Acme Build Updated",
        "legalName": "Acme Build Legal LLC",
        "taxId": "{{companyTaxId}}",
        "contactName": "Morgan Lee",
        "email": "morgan.lee@acmebuild.com",
        "phone": "+1 555 0101",
        "address": "200 Main St",
        "city": "Miami",
        "state": "FL",
        "customerType": "General Contractor",
        "industry": "Construction",
        "billingEmail": "billing@acmebuild.com",
        "paymentTerms": "Net 45",
        "customerStatus": "CUSTOMER",
        "assignedAccountManager": "Alex Johnson"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Requires `SYSTEM_OWNER`.

  `customerStatus` accepts `LEAD` or `CUSTOMER`.
