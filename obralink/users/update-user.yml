info:
  name: Update User
  type: http
  seq: 4
  tags:
    - users
http:
  method: PATCH
  url: "{{baseUrl}}/identity/users/{{userId}}"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  headers:
    - name: Content-Type
      value: application/json
    - name: x-tracking-id
      value: "{{trackingId}}"
  body:
    type: json
    data: |-
      {
        "firstName": "Updated",
        "lastName": "User",
        "identificationNumber": "0912345678",
        "status": "ACTIVE"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Requires `GLOBAL_ADMIN` or `TENANT_ADMIN` and `identity.users.update`.
