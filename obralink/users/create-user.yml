info:
  name: Create User
  type: http
  seq: 1
  tags:
    - users
http:
  method: POST
  url: "{{baseUrl}}/identity/users"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-tracking-id
      value: "{{trackingId}}"
  body:
    type: json
    data: |-
      {
        "companyId": "{{companyId}}",
        "email": "company-admin@obralink.com",
        "password": "ChangeMe123!",
        "firstName": "Company",
        "lastName": "Admin",
        "userType": "COMPANY_ADMIN",
        "identificationNumber": "0912345678",
        "personalEmail": "company.admin.personal@example.com",
        "phoneNumber": "+1 555 123 4567"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Requires `COMPANY_ADMIN` and `identity.users.create`.
