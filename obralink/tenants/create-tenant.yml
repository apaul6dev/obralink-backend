info:
  name: Create Tenant
  type: http
  seq: 1
  tags:
    - tenants
    - platform

http:
  method: POST
  url: "{{baseUrl}}/identity/tenants"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-tracking-id
      value: "{{trackingId}}"
  body:
    type: json
    data: |-
      {
        "name": "Obralink Construction",
        "legalName": "Obralink Construction LLC",
        "identificationNumber": "1799999999001"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Requires `GLOBAL_ADMIN`.
