info:
  name: Update Tenant
  type: http
  seq: 4
  tags:
    - tenants
    - platform
http:
  method: PATCH
  url: "{{baseUrl}}/identity/tenants/{{tenantId}}"
  params:
    - name: tenantId
      value: "{{tenantId}}"
      type: path
  headers:
    - name: Content-Type
      value: application/json
    - name: x-tracking-id
      value: "{{trackingId}}"
  body:
    type: json
    data: |-
      {
        "name": "Obralink Construction Updated",
        "legalName": "Obralink Construction Updated LLC",
        "identificationNumber": "1799999999001"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Requires `GLOBAL_ADMIN`.
