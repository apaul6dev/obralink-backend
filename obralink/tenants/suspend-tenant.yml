info:
  name: Suspend Tenant
  type: http
  seq: 6
  tags:
    - tenants
    - platform
http:
  method: PATCH
  url: "{{baseUrl}}/identity/tenants/{{tenantId}}/suspend"
  headers:
    - name: x-tracking-id
      value: "{{trackingId}}"
  params:
    - name: tenantId
      value: "{{tenantId}}"
      type: path
  auth:
    type: bearer
    token: "{{accessToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Requires `GLOBAL_ADMIN`.
