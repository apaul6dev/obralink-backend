info:
  name: Get Tenant By Id
  type: http
  seq: 3
  tags:
    - tenants
http:
  method: GET
  url: "{{baseUrl}}/identity/tenants/{{tenantId}}"
  headers:
    - name: x-tracking-id
      value: "{{trackingId}}"
  params:
    - name: tenantId
      value: "{{tenantId}}"
      type: path
  auth:
    type: bearer
    token: "{{accessToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  `GLOBAL_ADMIN` can read any tenant. Tenant users can read only their own tenant.
