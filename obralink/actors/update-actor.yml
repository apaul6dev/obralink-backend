info:
  name: Update Actor
  type: http
  seq: 4
  tags:
    - actors
http:
  method: PATCH
  url: "{{baseUrl}}/identity/actors/{{actorId}}"
  params:
    - name: actorId
      value: "{{actorId}}"
      type: path
  headers:
    - name: Content-Type
      value: application/json
    - name: x-tracking-id
      value: "{{trackingId}}"
  body:
    type: json
    data: |-
      {
        "type": "CLIENT",
        "name": "Acme Client Updated",
        "email": "client-updated@acme.com",
        "identificationNumber": "0999999999",
        "phone": "+593999999999",
        "status": "ACTIVE"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Updates a business actor using tenant access rules.
