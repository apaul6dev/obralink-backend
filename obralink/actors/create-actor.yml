info:
  name: Create Actor
  type: http
  seq: 1
  tags:
    - actors
http:
  method: POST
  url: "{{baseUrl}}/identity/actors"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-tracking-id
      value: "{{trackingId}}"
  body:
    type: json
    data: |-
      {
        "type": "CLIENT",
        "name": "Acme Client",
        "email": "client@acme.com",
        "identificationNumber": "0999999999",
        "phone": "+593999999999"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Creates a business actor inside the authenticated tenant.
