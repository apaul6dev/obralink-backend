info:
  name: Sign In Email
  type: http
  seq: 1
  tags:
    - auth
http:
  method: POST
  url: "{{baseUrl}}/auth/sign-in/email"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-tracking-id
      value: "{{trackingId}}"
  body:
    type: json
    data: |-
      {
        "email": "{{systemOwnerEmail}}",
        "password": "{{systemOwnerPassword}}"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Signs in with Better Auth and stores the session cookie for protected requests.

