info:
  name: Me
  type: http
  seq: 4
  tags:
    - auth

http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  headers:
    - name: x-tracking-id
      value: "{{trackingId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Returns the authenticated user context.
