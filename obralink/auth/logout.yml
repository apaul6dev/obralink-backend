info:
  name: Logout
  type: http
  seq: 3
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  headers:
    - name: x-tracking-id
      value: "{{trackingId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Revokes the current session and refresh tokens.
