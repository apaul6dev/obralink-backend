info:
  name: Get Session
  type: http
  seq: 2
  tags:
    - auth
http:
  method: GET
  url: "{{baseUrl}}/auth/get-session"
  headers:
    - name: x-tracking-id
      value: "{{trackingId}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Reads the current Better Auth session from the stored cookie.

