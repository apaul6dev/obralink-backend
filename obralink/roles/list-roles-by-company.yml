info:
  name: List Roles By Company
  type: http
  seq: 1
  tags:
    - roles
http:
  method: GET
  url: "{{baseUrl}}/identity/roles"
  headers:
    - name: x-tracking-id
      value: "{{trackingId}}"
  params:
    - name: companyId
      value: "{{companyId}}"
      type: query
      disabled: false
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Company users are forced to their active Better Auth organization. `companyId` is useful only for `SYSTEM_OWNER`.
