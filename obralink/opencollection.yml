opencollection: 1.0.0

info:
  name: Obralink Identity API
  description: Identity endpoints for companies, users, roles and permissions.
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
docs: |-
  # Obralink Identity API

  Base URL: `{{baseUrl}}`

  Protected requests use the Better Auth session cookie set by `/api/auth/*`.
